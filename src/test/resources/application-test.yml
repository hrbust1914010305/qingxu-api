spring:
  datasource:
    url: jdbc:h2:mem:qingxu_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

qingxu:
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
    csrf:
      enabled: false
