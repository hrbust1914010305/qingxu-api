spring:
  application:
    name: qingxu-api
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  session:
    timeout: 2h
    store-type: redis
    redis:
      namespace: spring:session:qingxu

server:
  port: 8081
  servlet:
    session:
      cookie:
        name: QINGXU_SESSION
        http-only: true
        same-site: none
        secure: false

qingxu:
  security:
    public-paths:
      - /auth/captcha
      - /auth/login
      - /auth/register
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /ws/**
      - /file-preview/source/**
      - /knowledge/progress/report
      - /knowledge/graph-progress/report
    cors:
      allowed-origins:
        - http://localhost:5173
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    csrf:
      # Development only. Do not use this value in production.
      enabled: false
  websocket:
    endpoint: /ws
    broker-prefixes:
      - /queue
      - /topic
    application-destination-prefix: /app
    user-destination-prefix: /user
    heartbeat:
      - 10000
      - 10000
    heartbeat-pool-size: 2
    notification-queue: /queue/notifications
    permission-reload-queue: /queue/permission-reload
  captcha:
    width: 120
    height: 40
    code-count: 4
    interfere-count: 15
    expires-in-seconds: 120
  file:
    storage-type: local
    local-root: F:/LocalFiles/files
    chunk-root: F:/LocalFiles/file-chunks
    normal-upload-threshold: 20MB
    chunk-size: 5MB
    max-size: 2GB
    upload-session-ttl: 24h
    cleanup-cron: "0 0 * * * ?"
    allowed-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - png
      - jpg
      - jpeg
      - gif
      - zip
      - rar
      - 7z
      - txt
      - mp3
      - mp4
    allowed-biz-types:
      - default
      - knowledge
      - user-avatar
    download-disposition: attachment
    checksum:
      enabled: true
  preview:
    enabled: true
    kk-file-view-base-url: http://127.0.0.1:8012
    public-base-url: http://127.0.0.1:8081
    token-ttl: 10m
    local-service:
      auto-start: true
      java-command: java
      jar-path: D:/project/qingxu/tools/kkFileView/bin/kkFileView-5.0.0.jar
      working-directory: D:/project/qingxu/tools/kkFileView/bin
      bin-folder: D:/project/qingxu/tools/kkFileView/bin
      trust-host: 127.0.0.1,localhost
      not-trust-host: default
      log-file: D:/project/qingxu/tools/kkFileView/log/kkFileView.log
      startup-timeout: 30s
    allowed-preview-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - md
      - json
      - xml
      - csv
      - zip
      - rar
      - 7z
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
      - svg
      - mp3
      - mp4
  knowledge:
    ai:
      enabled: ${QINGXU_KNOWLEDGE_AI_ENABLED:true}
      base-url: ${QINGXU_KNOWLEDGE_AI_BASE_URL:http://127.0.0.1:8002}
      start-path: ${QINGXU_KNOWLEDGE_AI_START_PATH:/rag/index}
      graph-start-path: ${QINGXU_KNOWLEDGE_AI_GRAPH_START_PATH:/rag/graph/build}
      graph-status-path: ${QINGXU_KNOWLEDGE_AI_GRAPH_STATUS_PATH:/rag/graph/status/{graphJobId}}
      cancel-path: ${QINGXU_KNOWLEDGE_AI_CANCEL_PATH:/rag/index/cancel}
      callback-token: ${QINGXU_KNOWLEDGE_AI_CALLBACK_TOKEN:dev-internal-token}
  session:
    timeout: 2h
    redis-namespace: spring:session:qingxu
    cookie:
      name: QINGXU_SESSION
      path: /
      max-age: -1
      http-only: true
      same-site:
        dev: Lax
        prod: None
      secure:
        dev: false
        prod: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    com.qingxu.qingxuapi: info


