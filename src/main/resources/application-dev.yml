spring:
  datasource:
    url: ${QINGXU_DB_URL:jdbc:postgresql://localhost:5432/qingxu}
    username: ${QINGXU_DB_USERNAME:qingxu}
    password: ${QINGXU_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${QINGXU_DB_POOL_MAX:10}
      minimum-idle: ${QINGXU_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${QINGXU_DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${QINGXU_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${QINGXU_DB_POOL_MAX_LIFETIME:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.qingxu.qingxuapi: debug
