spring:
  datasource:
    url: ${QINGXU_DB_URL:jdbc:postgresql://localhost:5432/qingxu}
    username: ${QINGXU_DB_USERNAME:qingxu}
    password: ${QINGXU_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${QINGXU_DB_POOL_MAX:10}
      minimum-idle: ${QINGXU_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${QINGXU_DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${QINGXU_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${QINGXU_DB_POOL_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${QINGXU_REDIS_HOST:localhost}
      port: ${QINGXU_REDIS_PORT:6379}
      password: ${QINGXU_REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true

qingxu:
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
    csrf:
      enabled: false

logging:
  level:
    com.qingxu.qingxuapi: debug
    org.springframework.security: debug
    org.springframework.session: debug
    org.springframework.web: debug
